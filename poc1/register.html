<title>Step 1: register a passkey</title>
<h2>Step 1: register a passkey with this site</h2>
<p>This page is the <b>relying party</b>. Its hostname is: <b><span id="h"></span></b></p>
<p>Press the button, and approve the LastPass prompt when it appears.</p>
<button onclick="reg()">Register a passkey here</button>
<pre id="out"></pre>
<p id="next" hidden>Copy the <b>credentialId</b> above, then open the attack page and paste it there.</p>
<script>
document.getElementById('h').textContent = location.hostname;
function b64u(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
async function reg(){
  const out=document.getElementById('out');
  out.textContent='registering ...';
  try{
    const c=await navigator.credentials.create({publicKey:{
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rp:{name:"demo"},
      user:{id: crypto.getRandomValues(new Uint8Array(16)), name:"demo-user", displayName:"demo-user"},
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{residentKey:"preferred",userVerification:"discouraged"},
      timeout: 60000
    }});
    out.textContent='rp_id_used: '+location.hostname+'\ncredentialId: '+c.id+'\nrawId_b64u: '+b64u(c.rawId);
    document.getElementById('next').hidden=false;
  }catch(e){ out.textContent='rejected_name: '+e.name+'\nrejected_message: '+e.message; }
}
</script>
